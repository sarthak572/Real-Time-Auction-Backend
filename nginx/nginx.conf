# Load balancer in front of the API instances (docker-compose service `nginx`, published on host port 3000).
# The API instances run on the host, so nginx reaches them through the `apihost` alias (IPv4 only: host.docker.internal also resolves to an IPv6 address the host does not listen on, which made nginx count failed attempts and mark healthy instances down).
worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 8192;
}

http {
  # Log only unexpected statuses (not 2xx/3xx, not the normal 409); the API already logs every bid.
  # request_id is the same id the API puts in its own logs (reqId), so one request can be followed end to end.
  log_format main '$time_iso8601 client=$remote_addr "$request_method $uri" status=$status '
                  'time=${request_time}s upstream=$upstream_addr upstream_time=${upstream_response_time}s rid=$request_id';
  # 409 is a normal answer ("bid too low" / "auction ended"), not a problem; logging every one floods the log under load.
  map $status $loggable { ~^[23] 0; 409 0; default 1; }
  access_log /dev/stdout main if=$loggable;
  error_log  /dev/stderr warn;

  # WebSocket upgrade only when the client asks for it; plain requests keep a reusable upstream connection.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  upstream api {
    least_conn;                       # long-lived WebSockets make "fewest active connections" fairer than round robin
    server apihost:3001 max_fails=2 fail_timeout=5s;
    server apihost:3002 max_fails=2 fail_timeout=5s;
    keepalive 128;                    # reuse connections to the instances
    keepalive_requests 10000;
    keepalive_timeout 60s;            # idle upstream connections are dropped by nginx after 60 s; Node waits 65 s (see app.ts)
  }

  server {
    listen 80;
    client_max_body_size 16k;         # bids are tiny; refuse anything big at the edge

    # Prometheus scrapes each instance directly; the outside world has no business reading internal metrics.
    location = /metrics {
      return 404;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite, never append: a client cannot fake its address
      proxy_set_header X-Request-Id      $request_id;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;

      proxy_connect_timeout 2s;
      proxy_send_timeout    30s;
      proxy_read_timeout    120s;       # the API pings WebSockets every 25 s, so live sockets are never idle this long

      # If an instance is down (connection refused / timeout BEFORE the request was sent), try the other one.
      # A bid that already reached an instance is NOT replayed on the other (nginx never retries POST after sending).
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 2;
    }
  }
}
